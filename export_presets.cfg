[preset.0]

name="Android Debug ARM64"
platform="Android"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
; Fase 4A: dos variantes Android debug con la MISMA autofirma y el MISMO package
; (com.lbagames.rpglba). ARM64 es la recomendada para telefonos (Redmi 9C, S22 Ultra).
; No cambiar package ID ni firma arbitrariamente: rompe actualizaciones.
; Fase 3B: los archivos de directorios con .gdignore jamas se exportan (el
; editor no los escanea) y include_filter NO los rescata en 4.7.2. Causa raiz
; del APK sin config/quality_profiles.json (corrida 43339724542). Se elimino
; config/.gdignore; con eso el escaneo los incluye, como ya pasaba con game/data.
include_filter=""
exclude_filter=""
export_path="res://builds/android/RPG-LBA-Android-ARM64-debug.apk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
gradle_build/use_gradle_build=false
gradle_build/gradle_build_directory=""
gradle_build/android_source_template=""
gradle_build/compress_native_libraries=false
gradle_build/min_sdk=""
gradle_build/target_sdk=""
package/unique_name="com.lbagames.rpglba"
package/name="RPG LBA - Las Cenizas de Lythara"
version/code=1
version/name="0.1.0"
screen/immersive_mode=true
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86_32=false
architectures/x86_64=false
; Autofirma open source (Fase 3B): keystore debug propio generado con keytool de OpenJDK.
; Credenciales PUBLICAS de convencion debug (no es un secreto; ver build/android/README.md).
; La MISMA clave para ARM64 y Universal: poder instalar una variante sobre otra sin
; conflicto de firma (INSTALL_FAILED_UPDATE_INCOMPATIBLE).
keystore/debug="build/android/rpglba-debug.keystore"
keystore/debug_user="rpglba-debug"
keystore/debug_password="android"
permissions/custom_permissions=PackedStringArray()

