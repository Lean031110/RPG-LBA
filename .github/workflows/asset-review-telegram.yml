name: Asset review Telegram notifications

on:
  pull_request:
    types: [opened, reopened, ready_for_review, review_requested]
    paths:
      - "assets/**"
      - "ART_DEPARTMENT/**"
  workflow_run:
    workflows:
      - "Asset Factory (produccion)"
      - "Asset Validation"
      - "Asset Publication"
    types: [completed]

permissions:
  contents: read

concurrency:
  group: asset-telegram-${{ github.event.pull_request.number || github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send notification when Telegram credentials exist
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Cadena compatible (auditoria 2026-11-18, docs/ops/SECRETS_AND_VARIABLES_AUDIT.md §6):
          # respeta el nombre documentado (TELEGRAM_CHAT_ID), el secret real existente
          # (TELEGRAM_ADMIN_CHAT_ID) y la variable si el propietario la volviera a crear.
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TELEGRAM_ADMIN_CHAT_ID || vars.TELEGRAM_CHAT_ID }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
          # Fix 2026-11-18: en eventos workflow_run github.event_path llega VACIO en
          # esta plataforma (run 44306896445: FileNotFoundError al abrir ''). Los
          # campos del run disparador se pasan via expresiones del contexto github,
          # que NO dependen del archivo de evento.
          TRIGGER_NAME: ${{ github.event.workflow_run.name }}
          TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          TRIGGER_URL: ${{ github.event.workflow_run.html_url }}
          TRIGGER_BRANCH: ${{ github.event.workflow_run.head_branch }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.parse
          import urllib.request

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "")
          if not token or not chat_id:
              print("SKIPPED: configure TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID in repository Actions secrets.")
              sys.exit(0)

          event = {}
          event_path = os.environ.get("EVENT_PATH", "")
          if event_path and os.path.isfile(event_path):
              with open(event_path, "r", encoding="utf-8") as handle:
                  event = json.load(handle)
          else:
              # Fix 2026-11-18: workflow_run no siempre expone event_path en esta
              # plataforma; los TRIGGER_* del env cubren ese caso.
              if os.environ.get("EVENT_NAME") == "workflow_run" and not os.environ.get("TRIGGER_CONCLUSION"):
                  print("SKIPPED: sin carga de evento ni TRIGGER_* disponibles.")
                  sys.exit(0)

          repo = os.environ["REPOSITORY"]
          event_name = os.environ["EVENT_NAME"]
          if event_name == "pull_request":
              pr = event.get("pull_request", {})
              action = event.get("action", "updated")
              title = pr.get("title", "Asset PR")
              url = pr.get("html_url", "")
              number = pr.get("number", "")
              text = (
                  f"RPG LBA — revisión de assets\n"
                  f"PR #{number}: {title}\n"
                  f"Evento: {action}\n"
                  f"Revisa catálogo, previews, licencias y reportes antes de aprobar.\n"
                  f"{url}"
              )
          elif event_name == "workflow_run":
              run = event.get("workflow_run", {})
              conclusion = run.get("conclusion") or os.environ.get("TRIGGER_CONCLUSION") or run.get("status") or "unknown"
              if conclusion in ("skipped", "cancelled"):
                  print(f"SKIPPED: workflow conclusion={conclusion}")
                  sys.exit(0)
              name = run.get("name") or os.environ.get("TRIGGER_NAME") or "Asset workflow"
              url = run.get("html_url") or os.environ.get("TRIGGER_URL") or os.environ["RUN_URL"]
              branch = run.get("head_branch") or os.environ.get("TRIGGER_BRANCH") or "unknown"
              prs = run.get("pull_requests") or []
              pr_line = f"PR: {prs[0].get('html_url', '')}\n" if prs else ""
              prefix = "⚠️" if conclusion != "success" else "✅"
              text = (
                  f"{prefix} RPG LBA — {name}\n"
                  f"Resultado: {conclusion}\n"
                  f"Rama: {branch}\n"
                  f"{pr_line}{url}"
              )
          else:
              print("SKIPPED: unsupported event")
              sys.exit(0)

          payload = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": text[:3900],
              "disable_web_page_preview": "true"
          }).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=payload,
              headers={"Content-Type": "application/x-www-form-urlencoded"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  result = json.loads(response.read().decode("utf-8"))
              if not result.get("ok"):
                  raise RuntimeError("Telegram API returned ok=false")
              print("PASS: Telegram notification sent; response content withheld.")
          except Exception as exc:
              print(f"FAIL: Telegram notification failed ({type(exc).__name__}); no token was printed.")
              raise
          PY
