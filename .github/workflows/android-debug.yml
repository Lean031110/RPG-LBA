name: RPG LBA - Android debug APK (autofirma + verificación de instalación)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      - 'agent/**'
      - 'feature/**'
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: rpg-lba-android-debug-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  APK_REL: artifacts/android/RPG-LBA-debug.apk
  PACKAGE: com.lbagames.rpglba

jobs:
  build-sign-verify:
    name: Export, autofirma open source y verificación estática
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check Android preset exists
        id: preset
        shell: bash
        run: |
          if [ -f export_presets.cfg ] && grep -q 'name="Android Debug"' export_presets.cfg; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Java
        if: steps.preset.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # La imagen de runner ya trae el SDK en /usr/local/lib/android/sdk. La acción
      # android-actions/setup-android@v3 falló en esta imagen (su `sdkmanager
      # --licenses` interno termina con exit 1); se maneja el SDK directamente.
      - name: Install Android packages (preinstalled SDK)
        if: steps.preset.outputs.ready == 'true'
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$SDK_DIR"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          SDKM="$(ls -d "$SDK_DIR"/cmdline-tools/*/bin/sdkmanager | head -n1)"
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" --install \
            "platform-tools" \
            "build-tools;35.0.1" \
            "platforms;android-35"
          # adb para el paso "Start adb server".
          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"

      - name: Cache Godot editor and export templates
        if: steps.preset.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/rpg-lba/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-stable-v1

      - name: Download Godot and export templates
        if: steps.preset.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          GODOT_DIR="$HOME/.cache/rpg-lba/godot"
          mkdir -p "$GODOT_DIR" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          if [ ! -x "$GODOT_DIR/Godot_v${GODOT_VERSION}-stable_linux.x86_64" ]; then
            curl -fsSL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o "$GODOT_DIR/godot.zip"
            unzip -q "$GODOT_DIR/godot.zip" -d "$GODOT_DIR"
            chmod +x "$GODOT_DIR/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
            rm -f "$GODOT_DIR/godot.zip"
          fi
          if [ ! -f "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_debug.apk" ]; then
            curl -fsSL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/templates.tpz
            mkdir -p /tmp/templates
            unzip -q /tmp/templates.tpz -d /tmp/templates
            cp -a /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
            rm -rf /tmp/templates /tmp/templates.tpz
          fi

      # El export de Godot lee el SDK y el JDK de Editor Settings; con dos
      # claves basta (probado en local). Las rutas absolutas salen del runner.
      - name: Write Godot Editor Settings (SDK + JDK paths)
        if: steps.preset.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo ''
            echo '[resource]'
            echo "export/android/android_sdk_path = \"${ANDROID_SDK_ROOT}\""
            echo "export/android/java_sdk_path = \"${JAVA_HOME}\""
          } > "$HOME/.config/godot/editor_settings-4.7.tres"
          cat "$HOME/.config/godot/editor_settings-4.7.tres"

      # Sin adb activo, Godot aborta (exit 134) al terminar el export headless.
      - name: Start adb server
        if: steps.preset.outputs.ready == 'true'
        run: adb start-server

      - name: Import project
        if: steps.preset.outputs.ready == 'true'
        run: |
          "$HOME/.cache/rpg-lba/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            --headless --editor --path . --quit

      # El directorio de destino debe existir antes del export.
      - name: Export debug APK (firma con la autofirma del proyecto)
        if: steps.preset.outputs.ready == 'true'
        run: |
          set -euo pipefail
          mkdir -p artifacts/android
          adb start-server || true
          set +e
          "$HOME/.cache/rpg-lba/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            --headless --path . --export-debug "Android Debug" "${APK_REL}"
          rc=$?
          set -e
          # Godot 4.7.2 conocido: tras terminar y verificar el export puede
          # abortar en el apagado headless ("cannot connect to daemon tcp:5037",
          # exit 134) si el daemon de adb no responde en ese instante. El APK ya
          # está completo y firmado antes de ese punto. Se toleran 0 y 134; el
          # paso siguiente verifica el artefacto de verdad y atrapa cualquier
          # corrupción real.
          if [ "$rc" != "0" ] && [ "$rc" != "134" ]; then
            echo "ERROR: export failed with code $rc" >&2
            exit 1
          fi
          echo "note: export exit code $rc (134 = crash de apagado post-export; tolerado)"
          test -s "${APK_REL}"

      - name: Verify APK (static checks)
        if: steps.preset.outputs.ready == 'true'
        run: |
          set -euo pipefail
          ./scripts/ci/verify_apk.sh "${APK_REL}" "${APK_REL%.*}_verification_report.txt" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload APK and report
        if: steps.preset.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: RPG-LBA-Android-debug
          path: |
            artifacts/android/RPG-LBA-debug.apk
            artifacts/android/RPG-LBA-debug_verification_report.txt
          retention-days: 14
          if-no-files-found: error

      - name: Report not configured
        if: steps.preset.outputs.ready != 'true'
        run: 'echo "SKIPPED: no Android Debug preset in export_presets.cfg; nothing to build."'

  emulator-install-test:
    name: Instalación y arranque en emulador (API 35)
    needs: build-sign-verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # SDK preinstalado del runner; sin android-actions/setup-android (ver job 1).
      - name: Install emulator and system image
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$SDK_DIR"
          SDKM="$(ls -d "$SDK_DIR"/cmdline-tools/*/bin/sdkmanager | head -n1)"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" --install \
            "platform-tools" \
            "emulator" \
            "system-images;android-35;google_apis;x86_64" >/dev/null
          # Poner en PATH las herramientas de los pasos siguientes.
          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_DIR/emulator" >> "$GITHUB_PATH"
          ls -d "$SDK_DIR"/cmdline-tools/*/bin | head -n1 >> "$GITHUB_PATH"

      - name: Check KVM
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "ERROR: /dev/kvm not available on this runner; cannot hardware-accelerate the emulator." >&2
            exit 1
          fi
          # Que exista NO basta (corrida 43336374165: 'This user doesn't have
          # permissions to use KVM' con /etc/group [kvm:x:991:] sin miembros).
          # x86_64 requiere aceleración por hardware: otorgar acceso real.
          if [ ! -w /dev/kvm ]; then
            sudo gpasswd -a "$USER" kvm || true
            sudo chmod 666 /dev/kvm || true
          fi
          if [ -w /dev/kvm ]; then
            echo "KVM accessible for this user."
          else
            echo "ERROR: /dev/kvm sigue inaccesible tras el ajuste." >&2
            exit 1
          fi

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: RPG-LBA-Android-debug
          path: dist

      - name: Boot emulator
        run: |
          set -euo pipefail
          # Fijar el hogar de los AVD y verificar que el .ini queda ahí:
          # corrida 43335712939: avdmanager creó el AVD en un directorio que el
          # emulador no busca ("Unknown AVD name ... no file rpglba_ci.ini in
          # $HOME/.android/avd").
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n rpglba_ci -k "system-images;android-35;google_apis;x86_64" --device pixel >/dev/null
          if [ ! -f "$ANDROID_AVD_HOME/rpglba_ci.ini" ]; then
            echo "avdmanager no dejó el ini en ANDROID_AVD_HOME; buscando dónde lo puso..."
            FOUND="$(find "$HOME" /usr/local/lib/android/sdk -name 'rpglba_ci.ini' -not -path '*/proc/*' 2>/dev/null | head -n1 || true)"
            if [ -n "$FOUND" ]; then
              SRC_DIR="$(dirname "$FOUND")"
              echo "Encontrado en $SRC_DIR; copiando a $ANDROID_AVD_HOME"
              cp -a "$SRC_DIR"/rpglba_ci* "$ANDROID_AVD_HOME"/
            else
              echo "ERROR: no se encontró rpglba_ci.ini en ningún sitio." >&2
              avdmanager list avd || true
              exit 1
            fi
          fi
          ls -la "$ANDROID_AVD_HOME" | head -n 6
          emulator -list-avds || true
          nohup emulator -avd rpglba_ci -no-window -gpu angle_indirect -noaudio -no-boot-anim -no-snapshot -accel on -verbose > /tmp/emulator.log 2>&1 &
          EMU_PID=$!
          # Nunca esperar sin limite: sondear con tope, detectar la muerte del
          # emulador y volcar su log para poder diagnosticar.
          _emu_alive() { kill -0 "$EMU_PID" 2>/dev/null; }
          _emu_dump() { echo "--- emulator.log (tail) ---" >&2; tail -n 60 /tmp/emulator.log >&2 || true; }
          deadline=$((SECONDS + 480))
          while :; do
            state="$(adb devices 2>/dev/null | awk 'NR>1 && NF {print $2}' | head -n1)"
            if [ "${state:-}" = "device" ]; then break; fi
            if ! _emu_alive; then echo "ERROR: el proceso del emulador murió." >&2; _emu_dump; exit 1; fi
            if [ "$SECONDS" -ge "$deadline" ]; then echo "ERROR: no llegó al estado 'device' en 480 s." >&2; _emu_dump; exit 1; fi
            sleep 5
          done
          deadline=$((SECONDS + 480))
          while [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" != "1" ]; do
            if ! _emu_alive; then echo "ERROR: el proceso del emulador murió durante el arranque." >&2; _emu_dump; exit 1; fi
            if [ "$SECONDS" -ge "$deadline" ]; then echo "ERROR: boot_completed no llegó en 480 s." >&2; _emu_dump; exit 1; fi
            sleep 5
          done
          echo "Emulator booted."
          adb shell input keyevent 82 || true

      - name: Install APK (valid to install?)
        run: |
          set -euo pipefail
          adb install -r dist/RPG-LBA-debug.apk | tee install.txt
          grep -q "Success" install.txt || { echo "ERROR: adb install did not report Success." >&2; exit 1; }

      - name: Launch game and watch for crashes
        run: |
          set -euo pipefail
          adb logcat -c
          COMPONENT=$(adb shell cmd package resolve-activity --brief "${PACKAGE}" | tail -n 1 | tr -d '\r')
          echo "Launchable component: $COMPONENT"
          echo "$COMPONENT" | grep -q "/" || { echo "ERROR: no launchable activity resolved." >&2; exit 1; }
          adb shell am start -n "$COMPONENT"
          sleep 25
          PID=$(adb shell pidof "${PACKAGE}" | tr -d '\r')
          if [ -z "$PID" ]; then
            echo "ERROR: process not alive 25s after launch." >&2
            adb logcat -d | tail -80 >&2
            exit 1
          fi
          echo "Process alive (pid $PID) 25s after launch."
          if adb logcat -d | grep -q "FATAL EXCEPTION"; then
            echo "ERROR: FATAL EXCEPTION found in logcat." >&2
            adb logcat -d | grep -A20 "FATAL EXCEPTION" >&2 || true
            exit 1
          fi
          adb logcat -d | grep -m1 "Godot Engine" || echo "note: no Godot Engine banner line in logcat (not fatal by itself)."

      - name: Wait for first render and capture evidence
        run: |
          set -euo pipefail
          # SwiftShader puede tardar en presentar el primer fotograma (pck + shaders).
          # La corrida 43337151226 capturo a los ~25 s: solo el aviso del sistema
          # "Pantalla completa" sobre negro. Ahora: sondear hasta que la region
          # central (donde va el menu, sin la franja superior del aviso) deje de
          # ser negra, con tope de 180 s, y guardar la captura final.
          # Descartar el aviso inmersivo (cualquier toque lo cierra) con un toque
          # en una esquina sin botones; y sondear mas abajo que la franja del aviso.
          adb shell input tap 180 990 || true
          deadline=$((SECONDS + 180))
          mean=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            adb exec-out screencap > /tmp/frame.raw || true
            mean=$(python3 - <<'PY'
          import struct
          try:
              d = open('/tmp/frame.raw', 'rb').read()
              w, h, fmt = struct.unpack('<III', d[:12])
              px = d[12:]
              x0, x1 = int(w * 0.25), int(w * 0.75)
              y0, y1 = int(h * 0.30), int(h * 0.75)
              total = 0
              count = 0
              stride = w * 4
              for y in range(y0, y1, 8):
                  row = px[y * stride:(y + 1) * stride]
                  for x in range(x0, x1, 8):
                      o = x * 4
                      total += row[o] + row[o + 1] + row[o + 2]
                      count += 3
              print(int(total / max(count, 1)))
          except Exception:
              print(0)
          PY
          )
            echo "render probe: central mean luma = $mean (threshold 7)"
            if [ "$mean" -ge 7 ]; then break; fi
            sleep 10
          done
          if [ "$mean" -lt 7 ]; then
            echo "ERROR: el juego no presento fotograma no negro en 180 s (mean=$mean)." >&2
            adb logcat -d | tail -120 >&2
            exit 1
          fi
          echo "First render confirmed (central mean luma $mean)."
          adb exec-out screencap -p > emulator_screenshot.png
          adb logcat -d > emulator_logcat.txt
          ls -la emulator_screenshot.png

      - name: Uninstall and shut down
        run: |
          adb uninstall "${PACKAGE}" || true
          adb emu kill || true
          pkill -f qemu-system || true

      - name: Upload emulator evidence
        uses: actions/upload-artifact@v4
        with:
          name: RPG-LBA-Android-emulator-evidence
          path: |
            emulator_screenshot.png
            emulator_logcat.txt
            install.txt
          retention-days: 14
          if-no-files-found: error

      - name: Summary
        run: |
          {
            echo "## Android debug APK — verificación de instalación"
            echo ""
            echo "- Instalación en emulador API 35 (x86_64, SwiftShader): **PASS**"
            echo "- Lanzamiento del juego y proceso vivo 25 s: **PASS**"
            echo "- Sin FATAL EXCEPTION en logcat: **PASS**"
            echo "- Captura y logcat adjuntos como artefactos."
            echo ""
            echo "Esto NO equivale a una prueba en dispositivo físico (queda NOT TESTED en dispositivo real)."
          } >> "$GITHUB_STEP_SUMMARY"
