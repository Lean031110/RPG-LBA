name: RPG LBA - Android debug APK (autofirma + verificación de instalación)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      - 'agent/**'
      - 'feature/**'
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: rpg-lba-android-debug-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  PACKAGE: com.lbagames.rpglba
  # Constantes de layout del menu medidas con scripts/local/measure_menu_layout.gd
  # (canvas 1280x720). Solo documentativas: el script de emulador las recalcula.
  MENU_TAP_NEW_GAME_Y: "423"
  MENU_TAP_PLAY_DX: "174"
  MENU_TAP_PLAY_DY: "159"
  MENU_TAP_PROTO_Y: "489"

jobs:
  build-sign-verify:
    name: Export, autofirma y verificación estática (ARM64 + Universal)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check Android presets exist
        id: preset
        shell: bash
        run: |
          if [ -f export_presets.cfg ] \
            && grep -q 'name="Android Debug ARM64"' export_presets.cfg \
            && grep -q 'name="Android Debug Universal"' export_presets.cfg; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Java
        if: steps.preset.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # La imagen de runner ya trae el SDK en /usr/local/lib/android/sdk. La acción
      # android-actions/setup-android@v3 falló en esta imagen (su `sdkmanager
      # --licenses` interno termina con exit 1); se maneja el SDK directamente.
      - name: Install Android packages (preinstalled SDK)
        if: steps.preset.outputs.ready == 'true'
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$SDK_DIR"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          SDKM="$(ls -d "$SDK_DIR"/cmdline-tools/*/bin/sdkmanager | head -n1)"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" --install \
            "platform-tools" \
            "build-tools;35.0.1" \
            "platforms;android-35"
          # adb para el paso "Start adb server".
          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_DIR/build-tools/35.0.1" >> "$GITHUB_PATH"

      - name: Cache Godot editor and export templates
        if: steps.preset.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/rpg-lba/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-stable-v1

      - name: Download Godot and export templates
        if: steps.preset.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          GODOT_DIR="$HOME/.cache/rpg-lba/godot"
          mkdir -p "$GODOT_DIR" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          if [ ! -x "$GODOT_DIR/Godot_v${GODOT_VERSION}-stable_linux.x86_64" ]; then
            curl -fsSL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o "$GODOT_DIR/godot.zip"
            unzip -q "$GODOT_DIR/godot.zip" -d "$GODOT_DIR"
            chmod +x "$GODOT_DIR/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
            rm -f "$GODOT_DIR/godot.zip"
          fi
          if [ ! -f "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_debug.apk" ]; then
            curl -fsSL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/templates.tpz
            mkdir -p /tmp/templates
            unzip -q /tmp/templates.tpz -d /tmp/templates
            cp -a /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
            rm -rf /tmp/templates /tmp/templates.tpz
          fi

      # El export de Godot lee el SDK y el JDK de Editor Settings; con dos
      # claves basta (probado en local). Las rutas absolutas salen del runner.
      - name: Write Godot Editor Settings (SDK + JDK paths)
        if: steps.preset.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo ''
            echo '[resource]'
            echo "export/android/android_sdk_path = \"${ANDROID_SDK_ROOT}\""
            echo "export/android/java_sdk_path = \"${JAVA_HOME}\""
          } > "$HOME/.config/godot/editor_settings-4.7.tres"
          cat "$HOME/.config/godot/editor_settings-4.7.tres"

      # Sin adb activo, Godot aborta (exit 134) al terminar el export headless.
      - name: Start adb server
        if: steps.preset.outputs.ready == 'true'
        run: adb start-server

      - name: Import project
        if: steps.preset.outputs.ready == 'true'
        run: |
          "$HOME/.cache/rpg-lba/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            --headless --editor --path . --quit

      # El directorio de destino debe existir antes del export.
      - name: Export debug APKs (firma con la autofirma del proyecto)
        if: steps.preset.outputs.ready == 'true'
        run: |
          set -euo pipefail
          mkdir -p artifacts/android
          adb start-server || true
          for PRESET in \
            "Android Debug ARM64:RPG-LBA-Android-ARM64-debug.apk" \
            "Android Debug Universal:RPG-LBA-Android-Universal-debug.apk"; do
            NAME="${PRESET%%:*}"
            FILE="${PRESET##*:}"
            echo "== export $NAME -> $FILE"
            set +e
            "$HOME/.cache/rpg-lba/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
              --headless --path . --export-debug "$NAME" "artifacts/android/$FILE"
            rc=$?
            set -e
            # Godot 4.7.2 conocido: tras terminar y verificar el export puede
            # abortar en el apagado headless ("cannot connect to daemon tcp:5037",
            # exit 134) si el daemon de adb no responde en ese instante. El APK ya
            # esta completo y firmado antes de ese punto. Se toleran 0 y 134; el
            # paso siguiente verifica el artefacto de verdad y atrapa corrupcion.
            if [ "$rc" != "0" ] && [ "$rc" != "134" ]; then
              echo "ERROR: export $NAME failed with code $rc" >&2
              exit 1
            fi
            echo "note: export $NAME exit code $rc (134 = crash de apagado post-export; tolerado)"
            test -s "artifacts/android/$FILE"
          done

      - name: Verify APKs (static checks, per-variant ABIs)
        if: steps.preset.outputs.ready == 'true'
        run: |
          set -euo pipefail
          ./scripts/ci/verify_apk.sh \
            "artifacts/android/RPG-LBA-Android-ARM64-debug.apk" \
            --report "artifacts/android/RPG-LBA-Android-ARM64-debug_verification_report.txt" \
            --abis "arm64-v8a" | tee -a "$GITHUB_STEP_SUMMARY"
          ./scripts/ci/verify_apk.sh \
            "artifacts/android/RPG-LBA-Android-Universal-debug.apk" \
            --report "artifacts/android/RPG-LBA-Android-Universal-debug_verification_report.txt" \
            --abis "arm64-v8a,armeabi-v7a,x86,x86_64" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Write SHA256SUMS and installation guide
        if: steps.preset.outputs.ready == 'true'
        run: |
          set -euo pipefail
          cd artifacts/android
          {
            sha256sum RPG-LBA-Android-ARM64-debug.apk
            sha256sum RPG-LBA-Android-Universal-debug.apk
          } > SHA256SUMS.txt
          cat > LEEME_INSTALACION.txt <<'TXT'
          RPG LBA - Instalacion del APK debug (Android)
          ============================================

          QUE ARCHIVO INSTALAR
          - RPG-LBA-Android-ARM64-debug.apk -> RECOMENDADO en telefono (Redmi 9C,
            Samsung S22 Ultra y cualquier arm64).
          - RPG-LBA-Android-Universal-debug.apk -> emuladores, pruebas y
            dispositivos antiguos de 32 bits. Mas pesado; misma firma y mismo
            package: se puede instalar encima de la variante ARM64 y viceversa.

          COMO INSTALARLO (pasos exactos)
          1. Descarga el artefacto ZIP desde la pagina de Actions.
          2. EXTRAE el ZIP: dentro hay UN archivo .apk y los informes.
             NO intentes instalar el .zip: un ZIP no es un APK y Android
             respondera "Error al analizar el paquete" (INSTALL_PARSE_FAILED_NOT_APK).
          3. Verifica el SHA-256 del .apk contra SHA256SUMS.txt.
          4. En el telefono: Ajustes -> Seguridad -> "Instalar apps desconocidas"
             -> permite tu explorador de archivos o tu navegador.
          5. Abre el .apk EXTRAIDO con el instalador de paquetes.

          SI FALLA LA INSTALACION
          Causas ya DESCARTADAS en el artefacto (verificacion estatica PASS):
          firma v2+v3 de la autofirma del proyecto, manifiesto valido
          (com.lbagames.rpglba, minSdk 24, targetSdk 36), ABIs correctos,
          zipalign PASS y resources.arsc Stored.
          Causas posibles:
          - Instalaste el .zip sin extraer -> extrae primero (causa mas comun).
          - Descarga truncada o corrupta -> compara SHA-256 y re-descarga.
          - Resto de una instalacion previa con OTRA firma -> desinstala la
            anterior (con autorizacion): INSTALL_FAILED_UPDATE_INCOMPATIBLE.
          - Para obtener el codigo de error exacto:
            adb install -r RPG-LBA-Android-ARM64-debug.apk
            y reporta el INSTALL_* que aparezca.

          Este APK es de DEBUG con la autofirma publica del proyecto
          (build/android/rpglba-debug.keystore). No usar para produccion.
          TXT
          # Quitar la sangria del heredoc (indentacion del YAML).
          sed -i 's/^          //' LEEME_INSTALACION.txt
          cd - >/dev/null
          cat artifacts/android/SHA256SUMS.txt | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload ARM64 APK and report
        if: steps.preset.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: RPG-LBA-Android-ARM64-debug
          path: |
            artifacts/android/RPG-LBA-Android-ARM64-debug.apk
            artifacts/android/RPG-LBA-Android-ARM64-debug_verification_report.txt
            artifacts/android/SHA256SUMS.txt
            artifacts/android/LEEME_INSTALACION.txt
          retention-days: 14
          if-no-files-found: error

      - name: Upload Universal APK and report
        if: steps.preset.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: RPG-LBA-Android-Universal-debug
          path: |
            artifacts/android/RPG-LBA-Android-Universal-debug.apk
            artifacts/android/RPG-LBA-Android-Universal-debug_verification_report.txt
            artifacts/android/SHA256SUMS.txt
            artifacts/android/LEEME_INSTALACION.txt
          retention-days: 14
          if-no-files-found: error

      - name: Report not configured
        if: steps.preset.outputs.ready != 'true'
        run: 'echo "SKIPPED: presets Android Debug ARM64/Universal not found in export_presets.cfg; nothing to build."'

  emulator-x86_64:
    name: Emulador x86_64 (API ${{ matrix.api }}) - Universal
    needs: build-sign-verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 35
            tag: google_apis
          - api: 36
            tag: default
    env:
      ANDROID_IMAGE: "system-images;android-${{ matrix.api }};${{ matrix.tag }};x86_64"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install emulator and system image
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$SDK_DIR"
          SDKM="$(ls -d "$SDK_DIR"/cmdline-tools/*/bin/sdkmanager | head -n1)"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" --install \
            "platform-tools" \
            "emulator" \
            "$ANDROID_IMAGE" >/dev/null
          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_DIR/emulator" >> "$GITHUB_PATH"
          ls -d "$SDK_DIR"/cmdline-tools/*/bin | head -n1 >> "$GITHUB_PATH"

      - name: Check KVM
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "ERROR: /dev/kvm not available on this runner; cannot hardware-accelerate the emulator." >&2
            exit 1
          fi
          if [ ! -w /dev/kvm ]; then
            sudo gpasswd -a "$USER" kvm || true
            sudo chmod 666 /dev/kvm || true
          fi
          if [ -w /dev/kvm ]; then
            echo "KVM accessible for this user."
          else
            echo "ERROR: /dev/kvm sigue inaccesible tras el ajuste." >&2
            exit 1
          fi

      - name: Download Universal APK
        uses: actions/download-artifact@v4
        with:
          name: RPG-LBA-Android-Universal-debug
          path: dist

      - name: Install, launch and capture (menu + escena jugable)
        env:
          APK: dist/RPG-LBA-Android-Universal-debug.apk
          OUT: evidence
          PACKAGE: ${{ env.PACKAGE }}
          BOOT_BUDGET_S: "480"
          RENDER_BUDGET_S: "240"
          TRY_VALDELUZ: "1"
        run: bash scripts/ci/emulator_install_test.sh

      - name: Upload emulator evidence (API ${{ matrix.api }})
        uses: actions/upload-artifact@v4
        with:
          name: RPG-LBA-Android-emulator-api${{ matrix.api }}-x86_64-evidence
          path: evidence
          retention-days: 14
          if-no-files-found: error

  emulator-arm64:
    name: Emulador arm64 (API 36) - ARM64
    needs: build-sign-verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # El APK ARM64 solo trae lib/arm64-v8a: para probarlo de verdad hay que
      # arrancarlo en una imagen arm64 (traduccion ARM->x86 del emulador; es
      # lenta: presupuesto de arranque ampliado). Fallback a android-35 si la
      # imagen 36 no esta disponible.
      - name: Install emulator and arm64 image (36 con fallback 35)
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$SDK_DIR"
          SDKM="$(ls -d "$SDK_DIR"/cmdline-tools/*/bin/sdkmanager | head -n1)"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "emulator" >/dev/null
          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_DIR/emulator" >> "$GITHUB_PATH"
          ls -d "$SDK_DIR"/cmdline-tools/*/bin | head -n1 >> "$GITHUB_PATH"
          FOUND=""
          for CAND in "android-36 default arm64-v8a" "android-35 default arm64-v8a"; do
            set -- $CAND
            API_V=$1; TAG_V=$2; ABI_V=$3
            PKG="system-images;$API_V;$TAG_V;$ABI_V"
            "$SDKM" --install "$PKG" >/dev/null 2>&1 || true
            if [ -d "$SDK_DIR/system-images/$API_V/$TAG_V/$ABI_V" ]; then
              FOUND="$PKG"
              break
            fi
          done
          if [ -z "$FOUND" ]; then
            echo "ERROR: ninguna imagen arm64-v8a (android-36/35) disponible." >&2
            exit 1
          fi
          echo "ANDROID_IMAGE=$FOUND" >> "$GITHUB_ENV"
          echo "arm64 image: $FOUND"

      - name: Check KVM
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "ERROR: /dev/kvm not available on this runner." >&2
            exit 1
          fi
          if [ ! -w /dev/kvm ]; then
            sudo gpasswd -a "$USER" kvm || true
            sudo chmod 666 /dev/kvm || true
          fi
          if [ -w /dev/kvm ]; then
            echo "KVM accessible for this user."
          else
            echo "ERROR: /dev/kvm sigue inaccesible tras el ajuste." >&2
            exit 1
          fi

      - name: Download ARM64 APK
        uses: actions/download-artifact@v4
        with:
          name: RPG-LBA-Android-ARM64-debug
          path: dist

      - name: Install, launch and capture (ARM64 en emulador arm64)
        env:
          APK: dist/RPG-LBA-Android-ARM64-debug.apk
          OUT: evidence
          PACKAGE: ${{ env.PACKAGE }}
          BOOT_BUDGET_S: "900"
          RENDER_BUDGET_S: "300"
          TRY_VALDELUZ: "1"
        run: bash scripts/ci/emulator_install_test.sh

      - name: Upload emulator evidence (arm64)
        uses: actions/upload-artifact@v4
        with:
          name: RPG-LBA-Android-emulator-arm64-evidence
          path: evidence
          retention-days: 14
          if-no-files-found: error

  informe:
    name: Informe de instalación (emulador vs físico)
    needs: [build-sign-verify, emulator-x86_64, emulator-arm64]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Resumen honesto
        run: |
          {
            echo "## Informe de instalacion Android (Fase 4A)"
            echo ""
            echo "| Prueba | Estado |"
            echo "|---|---|"
            echo "| Export + verificacion estatica (2 variantes, firma v2/v3, ABIs exactos) | ${{ needs.build-sign-verify.result }} |"
            echo "| Emulador x86_64 API 35 y 36 (Universal: install + arranque + capturas) | ${{ needs.emulator-x86_64.result }} |"
            echo "| Emulador arm64 (ARM64: install + arranque, traduccion lenta) | ${{ needs.emulator-arm64.result }} |"
            echo "| Dispositivo fisico Redmi 9C | PENDIENTE DE HARDWARE |"
            echo "| Dispositivo fisico Samsung S22 Ultra | PENDIENTE DE HARDWARE |"
            echo "| No compatible | ninguno declarado; ver matriz en docs/16 |"
            echo ""
            echo "- PASS en emulador NO equivale a PASS en dispositivo fisico."
            echo "- Telemetria PERF en perf_emulator.txt de cada evidencia: datos del"
            echo "  proceso en EMULADOR; no es un benchmark de telefono."
            echo "- Protocolo de pruebas fisicas para el propietario:"
            echo "  docs/16_COMPATIBILIDAD_ANDROID.md (instalacion limpia, primer arranque,"
            echo "  menu, nueva partida, movimiento, combate, inventario, minimapa,"
            echo "  orientacion, suspender/reanudar, temperatura 15-30 min, FPS y RAM)."
          } >> "$GITHUB_STEP_SUMMARY"
